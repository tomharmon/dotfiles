nixpkgs:
  allow_unfree: true

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  home-manager:
    url: github:nix-community/home-manager
    inputs:
      nixpkgs:
        follows: nixpkgs
  nix-darwin:
    url: github:nix-darwin/nix-darwin
    inputs:
      nixpkgs:
        follows: nixpkgs
